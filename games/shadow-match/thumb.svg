<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="50%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="250" fill="url(#bg)" rx="16"/>
  <rect x="130" y="35" width="140" height="135" rx="28" fill="#ffffff" filter="url(#shadow)" stroke="#8b5cf6" stroke-width="4" stroke-dasharray="6 4"/>
  <text x="200" y="132" font-size="76" text-anchor="middle" font-family="sans-serif" style="filter: brightness(0) opacity(0.85);">🐘</text>
  <circle cx="255" cy="45" r="16" fill="#f59e0b"/>
  <text x="255" y="52" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">?</text>
  <g filter="url(#shadow)">
    <circle cx="95" cy="180" r="30" fill="#ffffff"/>
    <text x="95" y="192" font-size="32" text-anchor="middle" font-family="sans-serif">🐘</text>
  </g>
  <g filter="url(#shadow)">
    <circle cx="200" cy="195" r="30" fill="#ffffff"/>
    <text x="200" y="207" font-size="32" text-anchor="middle" font-family="sans-serif">🐰</text>
  </g>
  <g filter="url(#shadow)">
    <circle cx="305" cy="180" r="30" fill="#ffffff"/>
    <text x="305" y="192" font-size="32" text-anchor="middle" font-family="sans-serif">🦁</text>
  </g>
  <text x="200" y="235" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="'Baloo 2', sans-serif">🐾 TÌM BÓNG CON VẬT</text>
</svg>

